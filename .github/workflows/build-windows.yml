name: Build EPS to PDF PRO

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate Windows application icon
        run: python scripts/create_icon.py
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --add-data "assets;assets" --icon "assets/waraqa.ico" --name EPS_to_PDF_PRO src/main.py
      - name: Verify executable
        run: |
          if (!(Test-Path "dist/EPS_to_PDF_PRO.exe")) { throw "Executable was not created." }
          Get-Item "dist/EPS_to_PDF_PRO.exe" | Select-Object Name, Length
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EPS-to-PDF-PRO-Windows-x64
          path: dist/EPS_to_PDF_PRO.exe
          if-no-files-found: error
      - name: Publish GitHub Release for the updater
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.1
          name: EPS to PDF PRO v2.1.1
          target_commitish: main
          files: dist/EPS_to_PDF_PRO.exe
          overwrite_files: true
          make_latest: true
